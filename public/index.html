<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咒語對決 · 線上對戰</title>
<style>
  :root {
    --bg:#0b0a1a; --panel:#15132b; --panel-2:#1d1a3a; --ink:#e9e6ff; --muted:#9a94c8;
    --gold:#ffd166; --you:#5ee6a8; --foe:#ff6b8b; --good:#6bff9e; --bad:#ff5c72; --dim:#4b4570;
    --shield:#6cc6ff; --heal:#7CFF9B; --reflect:#c792ff;
  }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #241f4d 0%, var(--bg) 60%);
    color: var(--ink); font-family:"Segoe UI", system-ui, -apple-system, "Microsoft JhengHei", sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%; padding:18px;
    -webkit-user-select:none; user-select:none;
  }
  h1 { font-size:22px; letter-spacing:4px; margin:4px 0 2px; font-weight:700; text-shadow:0 0 18px rgba(255,209,102,.35); }
  .sub { color:var(--muted); font-size:12px; letter-spacing:1px; margin-bottom:14px; }
  a { color: var(--gold); }

  .arena { width:min(920px,100%); display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .wizard { background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid #2b2752; border-radius:16px; padding:16px; position:relative; overflow:hidden; }
  .wizard.you { box-shadow:0 0 0 1px rgba(94,230,168,.15),0 10px 40px rgba(0,0,0,.4); }
  .wizard.foe { box-shadow:0 0 0 1px rgba(255,107,139,.15),0 10px 40px rgba(0,0,0,.4); }
  .wtop { display:flex; align-items:center; justify-content:space-between; }
  .name { font-weight:700; letter-spacing:2px; } .you .name{color:var(--you)} .foe .name{color:var(--foe)}
  .avatar { font-size:46px; text-align:center; margin:6px 0 10px; filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)); transition:transform .08s ease; }
  .avatar.hit { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  .hpbar { height:16px; background:#0d0b1f; border-radius:10px; overflow:hidden; border:1px solid #2b2752; position:relative; }
  .hpfill { height:100%; width:100%; transition:width .35s ease; }
  .you .hpfill{background:linear-gradient(90deg,#2fae74,var(--you))} .foe .hpfill{background:linear-gradient(90deg,#b83a53,var(--foe))}
  .shieldfill { position:absolute; top:0; left:0; height:100%; width:0%; transition:width .3s;
    background:repeating-linear-gradient(45deg,rgba(108,198,255,.55),rgba(108,198,255,.55) 6px,rgba(108,198,255,.3) 6px,rgba(108,198,255,.3) 12px); }
  .hptext { font-size:12px; color:var(--muted); margin-top:4px; text-align:right; }
  .status { font-size:12px; margin-top:4px; min-height:16px; letter-spacing:1px; }
  .tag { margin-right:8px; } .tag.sh{color:var(--shield)} .tag.rf{color:var(--reflect)}
  .castrow { margin-top:12px; min-height:40px; }
  .charge { height:8px; background:#0d0b1f; border-radius:6px; overflow:hidden; border:1px solid #2b2752; margin-top:6px; }
  .chargefill { height:100%; width:0%; background:linear-gradient(90deg,#ffb703,var(--gold)); transition:width .12s linear; }
  .castlabel { font-size:13px; color:var(--muted); min-height:18px; } .castlabel b{color:var(--gold); letter-spacing:1px;}

  .console { width:min(920px,100%); margin-top:16px; background:linear-gradient(180deg,#17143180,#12102a); border:1px solid #2b2752; border-radius:16px; padding:18px; text-align:center; }
  .state { font-size:12px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .incant { font-size:30px; font-weight:700; letter-spacing:2px; min-height:42px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .word { color:var(--dim); transition:color .15s; }
  .word.done { color:var(--good); text-shadow:0 0 12px rgba(107,255,158,.4); }
  .word.active .g{color:var(--good)} .word.active .r{color:var(--ink)} .word.active.err{text-shadow:0 0 12px rgba(255,92,114,.5)}
  .word.active .cursor { border-left:2px solid var(--gold); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50%{opacity:0} }
  .hint { color:var(--muted); font-size:13px; min-height:18px; margin-top:6px; }
  input#type { margin-top:14px; width:100%; max-width:520px; padding:14px 16px; font-size:20px; letter-spacing:2px; text-align:center; background:#0d0b1f; border:2px solid #33305e; border-radius:12px; color:var(--ink); outline:none; caret-color:var(--gold); transition:border-color .15s,box-shadow .15s; }
  input#type:focus { border-color:var(--gold); box-shadow:0 0 0 4px rgba(255,209,102,.12); }
  input#type.err { border-color:var(--bad); box-shadow:0 0 0 4px rgba(255,92,114,.15); }

  .spellbook { width:min(920px,100%); margin-top:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid #2b2752; border-radius:12px; padding:10px 12px; font-size:13px; }
  .card .sname{font-weight:700; letter-spacing:1px; font-size:15px;} .card .meta{color:var(--muted); margin-top:2px;}
  .card .kind{float:right; font-size:11px; padding:1px 7px; border-radius:8px;}
  .k-attack .sname{color:var(--gold)} .k-attack .kind{background:rgba(255,209,102,.15);color:var(--gold)}
  .k-shield .sname{color:var(--shield)} .k-shield .kind{background:rgba(108,198,255,.15);color:var(--shield)}
  .k-heal .sname{color:var(--heal)} .k-heal .kind{background:rgba(124,255,155,.12);color:var(--heal)}
  .k-interrupt .sname{color:#ffa86b} .k-interrupt .kind{background:rgba(255,168,107,.15);color:#ffa86b}
  .k-reflect .sname{color:var(--reflect)} .k-reflect .kind{background:rgba(199,146,255,.15);color:var(--reflect)}

  .toolbar { margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { background:linear-gradient(180deg,#2a2650,#211d43); color:var(--ink); border:1px solid #3a3568; border-radius:10px; padding:10px 16px; font-size:14px; letter-spacing:1px; cursor:pointer; transition:transform .06s,border-color .15s; }
  button:hover{border-color:var(--gold)} button:active{transform:translateY(1px)} button:disabled{opacity:.5;cursor:default}
  .stat { color:var(--muted); font-size:13px; } .stat b{color:var(--ink);}

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(6,5,16,.85); backdrop-filter:blur(4px); z-index:20; }
  .overlay.hide { display:none; }
  .lobby { width:min(440px,92%); background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid #2b2752; border-radius:18px; padding:26px; text-align:center; }
  .lobby h2 { margin:0 0 4px; letter-spacing:3px; }
  .lobby p { color:var(--muted); font-size:13px; margin:6px 0 16px; }
  .lobby input[type=text] { width:100%; padding:12px 14px; margin:6px 0; background:#0d0b1f; border:2px solid #33305e; border-radius:10px; color:var(--ink); font-size:15px; text-align:center; outline:none; }
  .lobby input:focus { border-color:var(--gold); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  .lobby button { width:100%; margin-top:10px; padding:12px; font-size:15px; }
  .divider { color:var(--dim); font-size:12px; margin:14px 0 4px; letter-spacing:2px; }
  .lobbyMsg { min-height:20px; color:var(--gold); font-size:14px; margin-top:12px; }
  .code-pill { display:inline-block; background:#0d0b1f; border:1px solid #33305e; border-radius:8px; padding:4px 12px; font-size:20px; letter-spacing:4px; color:var(--gold); margin:6px 0; }

  .banner { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(6,5,16,.82); backdrop-filter:blur(3px); z-index:25; }
  .banner.show { display:flex; }
  .banner h2 { font-size:44px; letter-spacing:6px; margin:0 0 10px; }
  .banner.win h2{color:var(--you); text-shadow:0 0 30px rgba(94,230,168,.5)} .banner.lose h2{color:var(--foe); text-shadow:0 0 30px rgba(255,107,139,.5)}
  .floaty { position:absolute; font-weight:800; font-size:22px; pointer-events:none; animation:rise 1s ease-out forwards; }
  @keyframes rise { from{opacity:1; transform:translateY(0)} to{opacity:0; transform:translateY(-40px)} }
</style>
</head>
<body>
  <h1>咒語對決</h1>
  <div class="sub">SPELL TYPING DUEL · 線上對戰 — <a href="practice.html">單人練習 →</a></div>

  <div class="arena">
    <div class="wizard you" id="youPanel">
      <div class="wtop"><span class="name" id="youName">🧙 你</span><span class="stat">連擊 <b id="combo">0</b></span></div>
      <div class="avatar" id="youAvatar">🧙‍♂️</div>
      <div class="hpbar"><div class="hpfill" id="youHp"></div><div class="shieldfill" id="youShield"></div></div>
      <div class="hptext" id="youHpText">100 / 100</div>
      <div class="status" id="youStatus"></div>
      <div class="castrow"><div class="castlabel" id="youCastLabel">打出咒語名字來啟動…</div></div>
    </div>
    <div class="wizard foe" id="foePanel">
      <div class="wtop"><span class="name" id="foeName">對手 🪄</span><span class="stat" id="connText">連線中…</span></div>
      <div class="avatar" id="foeAvatar">🧙</div>
      <div class="hpbar"><div class="hpfill" id="foeHp"></div><div class="shieldfill" id="foeShield"></div></div>
      <div class="hptext" id="foeHpText">100 / 100</div>
      <div class="status" id="foeStatus"></div>
      <div class="castrow">
        <div class="castlabel" id="foeCastLabel">等待對手…</div>
        <div class="charge"><div class="chargefill" id="foeCharge"></div></div>
      </div>
    </div>
  </div>

  <div class="console">
    <div class="state" id="stateLabel">待命 · 打出咒語名字</div>
    <div class="incant" id="incant"></div>
    <div class="hint" id="hint">打咒語名字啟動,再把隨機咒文打完。對手讀咒你看得到,可用 silence 打斷 / shield 開盾 / mirror 反彈。</div>
    <input id="type" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="在這裡打字…" disabled />
    <div class="toolbar">
      <span class="stat">WPM <b id="wpm">0</b></span>
      <span class="stat">命中 <b id="hits">0</b> · 失誤 <b id="misses">0</b></span>
      <button id="leaveBtn">離開房間</button>
    </div>
  </div>

  <div class="spellbook" id="spellbook"></div>

  <!-- 大廳 -->
  <div class="overlay" id="lobby">
    <div class="lobby">
      <h2>咒語對決</h2>
      <p>線上雙人打字對戰</p>
      <input type="text" id="nameInput" maxlength="16" placeholder="你的法師名(選填)">
      <button id="quickBtn">⚡ 快速配對</button>
      <div class="divider">— 或和朋友對戰 —</div>
      <div class="row">
        <input type="text" id="roomInput" maxlength="12" placeholder="房號(例如 abc)">
        <button id="joinBtn" style="width:auto; margin-top:0;">加入 / 建立</button>
      </div>
      <div class="lobbyMsg" id="lobbyMsg"></div>
    </div>
  </div>

  <!-- 勝負 -->
  <div class="banner" id="banner">
    <div style="text-align:center">
      <h2 id="bannerText">勝利</h2>
      <div class="lobbyMsg" id="rematchMsg"></div>
      <button id="rematchBtn" style="width:auto;">再來一場</button>
      <button id="backBtn" style="width:auto;">回大廳</button>
    </div>
  </div>

<script>
// ---------- 單字庫 ----------
const WORDS = {
  easy: ["rain","wind","fire","leaf","moss","star","moon","wolf","bear","hawk","crow","dust","gold","iron","salt","wave","tide","reef","cave","root","vine","seed","bark","fang","claw","horn","wing","tail","coal","lava","sand","snow","mist","dawn","dusk","frog","hare","lynx","mole","newt"],
  medium: ["storm","flame","ember","frost","blaze","shard","cloud","raven","crown","spark","thorn","amber","crest","drift","gleam","flare","surge","quake","bloom","flint","coral","pearl","ridge","brook","marsh","stone","ghost","cinder","willow","cedar","meadow","canyon","glacier","sabres"],
  hard: ["thunder","crystal","phantom","cascade","gravity","eclipse","mercury","paradox","tempest","whisper","shatter","horizon","mystery","obsidian","radiance","twilight","cyclone","inferno","torrent","gossamer","serpent","emerald","lantern","monsoon","nebula","zephyr","aurora"],
};
function pickWords(count, diff) {
  const pool = WORDS[diff].slice(); const out = [];
  for (let i = 0; i < count && pool.length; i++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  return out;
}
const SPELLS = [
  { name:"spark",    zh:"火花",    type:"attack",    count:1, diff:"easy",   power:8,  kind:"攻擊" },
  { name:"fireball", zh:"火球術",  type:"attack",    count:3, diff:"medium", power:20, kind:"攻擊" },
  { name:"meteor",   zh:"隕石術",  type:"attack",    count:5, diff:"hard",   power:46, kind:"攻擊" },
  { name:"shield",   zh:"護盾",    type:"shield",    count:2, diff:"easy",   power:30, kind:"護盾" },
  { name:"heal",     zh:"治療",    type:"heal",      count:3, diff:"medium", power:26, kind:"補血" },
  { name:"silence",  zh:"沉默/打斷", type:"interrupt", count:2, diff:"medium", power:0, kind:"打斷" },
  { name:"mirror",   zh:"鏡壁/反彈", type:"reflect",   count:3, diff:"hard",  power:0, kind:"反彈" },
];
const SPELL_MAP = Object.fromEntries(SPELLS.map(s => [s.name, s]));
const KIND_CLASS = { attack:"k-attack", shield:"k-shield", heal:"k-heal", interrupt:"k-interrupt", reflect:"k-reflect" };
const $ = id => document.getElementById(id);
const input = $("type"), incantEl = $("incant");

// ---------- 本機遊戲狀態 ----------
let ws = null, youIdx = 0;
let running = false;
let mode = "idle", spell = null, words = [], wordIndex = 0, errFlag = false;
let oppCast = null; // {spell, index}
let combo = 0, hits = 0, misses = 0, typedChars = 0, startTime = 0;

// ---------- 咒語書 ----------
function renderSpellbook() {
  const sb = $("spellbook"); sb.innerHTML = "";
  for (const s of SPELLS) {
    const eff = s.type==="attack"?`${s.power} 傷`:s.type==="shield"?`+${s.power} 盾`:s.type==="heal"?`+${s.power} 血`:s.type==="interrupt"?"中斷對手":"反彈一次";
    const d = document.createElement("div"); d.className = "card " + KIND_CLASS[s.type];
    d.innerHTML = `<span class="kind">${s.kind}</span><div class="sname">${s.name}</div><div>${s.zh}</div><div class="meta">${s.count} 字 · ${eff}</div>`;
    sb.appendChild(d);
  }
}

// ---------- 連線 ----------
function connect(room) {
  const name = $("nameInput").value.trim();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ t: "join", room, name }));
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => { if (running) { $("connText").textContent = "已斷線"; } };
  ws.onerror = () => $("lobbyMsg").textContent = "連線失敗,請確認伺服器已啟動。";
}

function handle(m) {
  switch (m.t) {
    case "waiting":
      $("lobbyMsg").innerHTML = m.code
        ? `房間已建立,把房號給朋友:<br><span class="code-pill">${m.code}</span><br>等待對手加入…`
        : "配對中,等待對手…";
      break;
    case "roomFull": $("lobbyMsg").textContent = "這個房間已滿,換一個房號吧。"; break;
    case "start": onStart(m); break;
    case "state": applyState(m.you, m.opp); break;
    case "oppCast": onOppCast(m.spell); break;
    case "oppProgress": onOppProgress(m.index); break;
    case "resolve": onResolve(m); break;
    case "interrupted": onInterrupted(); break;
    case "gameover": onGameover(m.win); break;
    case "oppLeft": onOppLeft(); break;
    case "oppWantsRematch": $("rematchMsg").textContent = "對手想再來一場!"; break;
  }
}

// ---------- 開局 ----------
function onStart(m) {
  youIdx = m.youIdx; running = true;
  $("lobby").classList.add("hide"); $("banner").className = "banner";
  $("foeName").textContent = (m.oppName || "對手") + " 🪄";
  $("connText").textContent = "對戰中";
  $("rematchMsg").textContent = "";
  mode = "idle"; spell = null; words = []; wordIndex = 0; errFlag = false; oppCast = null;
  combo = 0; hits = 0; misses = 0; typedChars = 0; startTime = performance.now();
  $("combo").textContent = 0; $("hits").textContent = 0; $("misses").textContent = 0; $("wpm").textContent = 0;
  $("foeCharge").style.width = "0%"; $("foeCastLabel").textContent = "對手待命中…";
  $("youCastLabel").textContent = "打出咒語名字來啟動…";
  incantEl.innerHTML = ""; input.value = ""; input.disabled = false; input.focus();
  applyState(m.you, m.opp);
  setState("待命 · 打出咒語名字");
}

// ---------- 狀態渲染 ----------
function applyState(you, opp) {
  $("youHp").style.width = you.hp / you.max * 100 + "%";
  $("foeHp").style.width = opp.hp / opp.max * 100 + "%";
  $("youShield").style.width = Math.min(100, you.shield / you.max * 100) + "%";
  $("foeShield").style.width = Math.min(100, opp.shield / opp.max * 100) + "%";
  $("youHpText").textContent = `${you.hp} / ${you.max}`;
  $("foeHpText").textContent = `${opp.hp} / ${opp.max}`;
  let ys = ""; if (you.shield>0) ys += `<span class="tag sh">🛡 ${you.shield}</span>`; if (you.reflect) ys += `<span class="tag rf">🪞 反彈就緒</span>`;
  $("youStatus").innerHTML = ys;
  $("foeStatus").innerHTML = (opp.shield>0?`<span class="tag sh">🛡 ${opp.shield}</span>`:"") + (opp.reflect?`<span class="tag rf">🪞 反彈</span>`:"");
}
function setState(t){ $("stateLabel").textContent = t; }
function hitAvatar(el){ el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"),300); }
function floaty(panel, text, color){ const f=document.createElement("div"); f.className="floaty"; f.textContent=text; f.style.color=color; f.style.left=(30+Math.random()*40)+"%"; f.style.top="40%"; panel.appendChild(f); setTimeout(()=>f.remove(),1000); }
function updateWpm(){ const mins=(performance.now()-startTime)/60000; $("wpm").textContent = mins>0?Math.round((typedChars/5)/mins):0; }

// ---------- 對手施法顯示 ----------
function onOppCast(name) {
  const s = SPELL_MAP[name]; oppCast = { spell:name, index:0 };
  $("foeCastLabel").innerHTML = `讀取 <b>${name}</b> (${s?s.zh:""})… 可打斷/開盾/反彈`;
  $("foeCharge").style.width = "4%";
}
function onOppProgress(index) {
  if (!oppCast) return; oppCast.index = index;
  const s = SPELL_MAP[oppCast.spell]; const total = s ? s.count : 1;
  $("foeCharge").style.width = Math.min(100, index/total*100) + "%";
}
function clearOppCast(){ oppCast=null; $("foeCharge").style.width="0%"; }

// ---------- 結算(來自伺服器)----------
function onResolve(m) {
  const iAmCaster = m.caster === youIdx;
  const casterPanel = iAmCaster ? $("youPanel") : $("foePanel");
  const casterAvatar = iAmCaster ? $("youAvatar") : $("foeAvatar");
  const oppOfCaster = 1 - m.caster;

  if (m.effect === "attack") {
    const targetIsYou = m.target === youIdx;
    const panel = targetIsYou ? $("youPanel") : $("foePanel");
    const avatar = targetIsYou ? $("youAvatar") : $("foeAvatar");
    floaty(panel, (m.reflected?"反彈 ":"") + `-${m.dmg}`, m.reflected?"var(--reflect)":(targetIsYou?"var(--you)":"var(--foe)"));
    hitAvatar(avatar);
    if (iAmCaster && !m.reflected) { combo++; $("combo").textContent = combo; $("youCastLabel").innerHTML = `命中 <b>${m.dmg}</b> 傷害!連擊 x${combo}`; }
    else if (iAmCaster && m.reflected) { combo = 0; $("combo").textContent = 0; $("youCastLabel").innerHTML = `被鏡壁反彈,自傷 ${m.dmg}!`; }
  } else if (m.effect === "shield") {
    floaty(casterPanel, `+${m.value}🛡`, "var(--shield)");
    if (iAmCaster) $("youCastLabel").innerHTML = `護盾就緒,吸收接下來的傷害`;
  } else if (m.effect === "heal") {
    floaty(casterPanel, `+${m.value}❤`, "var(--heal)");
    if (iAmCaster) $("youCastLabel").innerHTML = `恢復 <b>${m.value}</b> 點生命`;
  } else if (m.effect === "interrupt") {
    if (m.hit) {
      const tgtPanel = (oppOfCaster === youIdx) ? $("youPanel") : $("foePanel");
      floaty(tgtPanel, "打斷!", "#ffa86b");
      if (oppOfCaster === youIdx) onInterrupted(); else clearOppCast();
      if (iAmCaster) $("youCastLabel").innerHTML = "成功打斷對手!";
    } else if (iAmCaster) $("youCastLabel").innerHTML = "對手沒在讀咒,打斷落空…";
  } else if (m.effect === "reflect") {
    floaty(casterPanel, "🪞 反彈", "var(--reflect)");
    if (iAmCaster) $("youCastLabel").innerHTML = "架起鏡壁,反彈對手下一發攻擊";
  }
  if (m.caster === (1 - youIdx)) clearOppCast(); // 對手完成施法
  updateWpm();
}

// ---------- 被打斷 ----------
function onInterrupted() {
  if (mode === "casting") {
    mode = "idle"; spell = null; words = []; wordIndex = 0; errFlag = false;
    input.value = ""; incantEl.innerHTML = ""; setState("待命 · 打出咒語名字");
    $("youCastLabel").innerHTML = "<b style='color:var(--bad)'>你的施法被打斷了!</b>";
    input.classList.add("err"); setTimeout(()=>input.classList.remove("err"),300);
  }
}

// ---------- 輸入 ----------
input.addEventListener("input", () => {
  if (!running) return;
  const raw = input.value.toLowerCase().replace(/[^a-z]/g, "");
  input.classList.remove("err");

  if (mode === "idle") {
    const s = SPELL_MAP[raw];
    if (s) { beginCast(s); return; }
    if (raw.length > 0 && !SPELLS.some(sp => sp.name.startsWith(raw))) { input.classList.add("err"); setTimeout(()=>input.classList.remove("err"),180); input.value = ""; }
    return;
  }
  // casting
  const target = words[wordIndex];
  if (raw === target) {
    hits++; typedChars += target.length; $("hits").textContent = hits;
    wordIndex++; input.value = ""; errFlag = false;
    ws.send(JSON.stringify({ t: "progress", index: wordIndex }));
    if (wordIndex >= words.length) finishCast(); else renderIncant();
    return;
  }
  if (!target.startsWith(raw)) {
    input.classList.add("err");
    if (!errFlag) { misses++; $("misses").textContent = misses; combo = 0; $("combo").textContent = 0; errFlag = true; }
  } else errFlag = false;
  renderIncant();
});

function beginCast(s) {
  spell = s; words = pickWords(s.count, s.diff); mode = "casting"; wordIndex = 0; errFlag = false; input.value = "";
  setState(`吟唱中 · ${s.name.toUpperCase()} (${s.zh})`);
  $("youCastLabel").innerHTML = `施放 <b>${s.name}</b> — 打完 ${s.count} 段咒文!`;
  renderIncant();
  ws.send(JSON.stringify({ t: "castStart", spell: s.name }));
}
function finishCast() {
  ws.send(JSON.stringify({ t: "castComplete", spell: spell.name }));
  mode = "idle"; const done = spell; spell = null; words = []; wordIndex = 0; errFlag = false;
  input.value = ""; incantEl.innerHTML = ""; setState("待命 · 打出咒語名字");
}
function renderIncant() {
  incantEl.innerHTML = "";
  if (mode !== "casting") return;
  const cur = input.value.toLowerCase().replace(/[^a-z]/g,""); const target = words[wordIndex] || ""; const isPrefix = target.startsWith(cur);
  words.forEach((w, i) => {
    const span = document.createElement("span"); span.className = "word";
    if (i < wordIndex) { span.classList.add("done"); span.textContent = w; }
    else if (i === wordIndex) {
      span.classList.add("active"); if (!isPrefix) span.classList.add("err");
      const matched = isPrefix ? cur.length : 0;
      const g=document.createElement("span"); g.className="g"; g.textContent=w.slice(0,matched);
      const c=document.createElement("span"); c.className="cursor";
      const r=document.createElement("span"); r.className="r"; r.textContent=w.slice(matched);
      span.append(g,c,r);
    } else span.textContent = w;
    incantEl.appendChild(span);
  });
}

// ---------- 勝負 / 離開 ----------
function onGameover(win) {
  running = false; input.disabled = true;
  $("banner").className = "banner show " + (win ? "win" : "lose");
  $("bannerText").textContent = win ? "勝利!" : "落敗…";
  $("rematchMsg").textContent = "";
}
function onOppLeft() {
  running = false; input.disabled = true;
  $("banner").className = "banner show win";
  $("bannerText").textContent = "對手離開了";
  $("rematchMsg").textContent = "";
  $("rematchBtn").style.display = "none";
}
function backToLobby() {
  if (ws) { ws.close(); ws = null; }
  running = false; input.disabled = true;
  $("banner").className = "banner"; $("lobby").classList.remove("hide");
  $("lobbyMsg").textContent = ""; $("rematchBtn").style.display = "";
}

$("quickBtn").addEventListener("click", () => { $("lobbyMsg").textContent = "連線中…"; connect(""); });
$("joinBtn").addEventListener("click", () => {
  const room = $("roomInput").value.trim();
  if (!room) { $("lobbyMsg").textContent = "請輸入房號。"; return; }
  $("lobbyMsg").textContent = "連線中…"; connect(room);
});
$("roomInput").addEventListener("keydown", e => { if (e.key === "Enter") $("joinBtn").click(); });
$("rematchBtn").addEventListener("click", () => { if (ws) { ws.send(JSON.stringify({ t:"rematch" })); $("rematchMsg").textContent = "等待對手同意…"; } });
$("backBtn").addEventListener("click", backToLobby);
$("leaveBtn").addEventListener("click", backToLobby);
document.addEventListener("keydown", () => { if (running && document.activeElement !== input) input.focus(); });

renderSpellbook();
</script>
</body>
